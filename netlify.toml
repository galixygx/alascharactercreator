# ─────────────────────────────────────────────────────────
#  Alas Character Creator — Netlify Configuration
# ─────────────────────────────────────────────────────────

[build]
  publish = "."
  command  = ""          # static site — no build step needed

# ── Security & cache headers ──────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# Never cache index.html so patches go live instantly
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# Cache everything else aggressively (fonts, images, assets)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ─────────────────────────────────────────────

# Redirect bare domain to www  (or flip — pick one)
[[redirects]]
  from   = "https://alascharactercreator.com/*"
  to     = "https://www.alascharactercreator.com/:splat"
  status = 301
  force  = true

# Serve index.html for every path (single-page app)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
