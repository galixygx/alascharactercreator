# ─────────────────────────────────────────────────────────
#  Alas Character Creator — Netlify Configuration
# ─────────────────────────────────────────────────────────

[build]
  publish = "."
  command  = ""          # static site — no build step needed

# ── Security & cache headers ──────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# Never cache index.html so patches go live instantly
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# Cache everything else aggressively (fonts, images, assets)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ─────────────────────────────────────────────

# NOTE: Do NOT add a www↔bare-domain redirect rule here.
# Netlify's site settings already define "alascharactercreator.com" as the
# Custom (primary) domain and "www.alascharactercreator.com" as a Domain
# alias — Netlify automatically redirects the alias to the primary domain.
# A `[[redirects]]` rule here that forces the *opposite* direction
# (bare → www) fights that built-in behavior and creates an infinite
# 301 redirect loop (alascharactercreator.com → www → alascharactercreator.com → ...),
# making the entire live site unreachable ("ERR_TOO_MANY_REDIRECTS").
# This was confirmed live via curl on 2026-06-07 — both the bare domain and
# the www subdomain were redirecting to each other in an endless loop.
# If you ever want to change the canonical domain, change it in
# Site settings → Domain management on Netlify — not here.

# Serve index.html for every path (single-page app)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
